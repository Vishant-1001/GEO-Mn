# GEO-MN synthetic subsurface scenario generator — configuration (SIMULATED evidence only)
# REAL constraints are read from data/processed/subsurface/geological_constraints.json (cited NMET/IBM sources).
generator_version: "subsurface-sim-1.0"
schema_version: "1.0"
seed: 42
holes_per_target: 3
overburden_m: [2.0, 3.0]            # REAL: "thickness of overburden is around 2 to 3 m" (NMET_NAGARDHAN)
reef_true_thickness_m: [1.5, 2.0]   # REAL: reef widths 1.5-2 m (NMET_KAWALEWADA)
supergene_depth_m: 15.0             # assumption: near-surface oxide enrichment zone
assay_rel_sd: 0.03                  # assumption: 3 % relative assay precision
surface_samples: 8
grade:
  ore_mean: 32.0                    # REAL range centre: 26-38 % (NMET_NAGARDHAN), <38 % Grade III (NMET_KAWALEWADA)
  ore_sd: 5.0
  ore_min: 18.0
  ore_max: 45.0                     # REAL: megascopic samples up to 45 % (NMET_KAWALEWADA)
  supergene_uplift: 3.0             # assumption
  ambiguous_mean: 17.0              # assumption: thin, low-grade / gonditic intersections
  ambiguous_sd: 5.0
  background_median: 0.4            # assumption: host-rock Mn %
  mineralised_cutoff: 10.0          # assumption: interval counted as Mn-bearing
  surface_anomaly_median: 15.0      # assumption; REAL hand-held XRF surface readings were 12.4-26.8 % (NMET_KATORI)
  sio2_ore_base: 45.0               # assumption: SiO2 falls as Mn rises (oxide ore vs gondite)
ip_background_ms: 8.0               # assumption: chargeability background (mV/V)
ip_anomaly_factor: [0.6, 1.4]
ip_noise_ms: 1.0
